syntax = "proto3";

package event.v1;

import "buf/validate/validate.proto";

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

// 当一个新的项目被创建
message EventProjectCreated {
  string project_id = 1 [
    (buf.validate.field).string = {
      len: 24,
    }
  ];
}

// 当项目被请求部署
message EventProjectDeploymentRequested {
  string project_id = 1 [
    (buf.validate.field).string = {
      len: 24,
    }
  ];
}

// 当已完成项目的文件系统/会话/配置等完成部署
message EventProjectDeploymentFinished {
  string project_id = 1 [
    (buf.validate.field).string = {
      len: 24,
    }
  ];
}

// 当项目部署失败（可能是配置/模板等错误）
message EventProjectDeploymentFailed {
  string project_id = 1 [
    (buf.validate.field).string = {
      len: 24,
    }
  ];
}