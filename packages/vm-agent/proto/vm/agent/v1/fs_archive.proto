syntax = "proto3";

package vm.agent.v1;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "vm/agent/v1/fs.proto";

message VMAgentFSArchiveServicePackRequest {
  vm.agent.v1.VMAgentFSPath source = 1 [(buf.validate.field).required = true];
  vm.agent.v1.VMAgentFSHash destination = 2 [(buf.validate.field).required = true];
}

message VMAgentFSArchiveServicePackResponse {}

message VMAgentFSArchiveServiceUnpackRequest {
  vm.agent.v1.VMAgentFSPath source = 1 [(buf.validate.field).required = true];
  vm.agent.v1.VMAgentFSHash destination = 2 [(buf.validate.field).required = true];
}

message VMAgentFSArchiveServiceUnpackResponse {}

service VMAgentFSArchiveService {
  rpc Pack(VMAgentFSArchiveServicePackRequest) returns (VMAgentFSArchiveServicePackResponse);
  rpc Unpack(VMAgentFSArchiveServiceUnpackRequest) returns (VMAgentFSArchiveServiceUnpackResponse);
}
