syntax = "proto3";

package api.v1;

import "buf/validate/validate.proto";

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";


// 由 Manager 消费
message Supervisor {
  string id = 1 [
    (buf.validate.field).string = {
      len: 24,
    }
  ];
  bytes public_key = 2 [
    (buf.validate.field).bytes = {
      min_len: 16,
      max_len: 128,
    }
  ];
  string name = 3 [
    (buf.validate.field).string = {
      min_len: 1,
      max_len: 128,
    }
  ];
  google.protobuf.BytesValue metadata = 4 [
    (buf.validate.field).bytes = {
      max_len: 2048,
    }
  ];
  google.protobuf.Timestamp create_time = 5 [
    (buf.validate.field).required = true
  ];
  google.protobuf.Timestamp update_time = 6 [
    (buf.validate.field).required = true
  ];
}

message SupervisorServiceCreateRequest {
  string name = 1 [
    (buf.validate.field).string = {
      min_len: 1,
      max_len: 128,
    }
  ];
  google.protobuf.BytesValue metadata = 2 [
    (buf.validate.field).bytes = {
      max_len: 2048,
    }
  ];
};
message SupervisorServiceCreateResponse {
  Supervisor supervisor = 1 [
    (buf.validate.field).required = true
  ];
  bytes private_key = 2 [
    (buf.validate.field).bytes = {
      min_len: 16,
      max_len: 128,
    }
  ];
};

message SupervisorServiceUpdateMetadataRequest {
  string id = 1 [
    (buf.validate.field).string = {
      len: 24,
    }
  ];
  google.protobuf.BytesValue metadata = 2 [
    (buf.validate.field).bytes = {
      max_len: 2048,
    }
  ];
}
message SupervisorServiceUpdateMetadataResponse {
  Supervisor supervisor = 1 [
    (buf.validate.field).required = true
  ];
};

message SupervisorServiceUpdateNameRequest {
  string id = 1 [
    (buf.validate.field).string = {
      len: 24,
    }
  ];
  string name = 2 [
    (buf.validate.field).string = {
      min_len: 1,
      max_len: 128,
    }
  ];
}
message SupervisorServiceUpdateNameResponse {
  Supervisor supervisor = 1 [
    (buf.validate.field).required = true
  ];
};

message SupervisorServiceDeleteRequest {
  string id = 1 [
    (buf.validate.field).string = {
      len: 24,
    }
  ];
}
message SupervisorServiceDeleteResponse {};

message SupervisorServiceGetRequest {
  string id = 1 [
    (buf.validate.field).string = {
      len: 24,
    }
  ];
}
message SupervisorServiceGetResponse {
  Supervisor supervisor = 1 [
    (buf.validate.field).required = true
  ];
};

message SupervisorServiceListRequest {
  int32 page = 1 [
    (buf.validate.field).int32 = {
      gt: 0,
    }
  ];
  int32 page_size = 2 [
    (buf.validate.field).int32 = {
      gt: 0,
      lte: 100,
    }
  ];
  google.protobuf.BoolValue disabled = 3;
}
message SupervisorServiceListResponse {
  repeated Supervisor supervisors = 1 [
    (buf.validate.field).repeated = {
      min_items: 0,
    }
  ];
  int32 total = 2 [
    (buf.validate.field).int32 = {
      gte: 0,
    }
  ];
};

service SupervisorService {
  rpc Create(SupervisorServiceCreateRequest) returns (SupervisorServiceCreateResponse);
  rpc UpdateMetadata(SupervisorServiceUpdateMetadataRequest) returns (SupervisorServiceUpdateMetadataResponse);
  rpc UpdateName(SupervisorServiceUpdateNameRequest) returns (SupervisorServiceUpdateNameResponse);
  rpc Delete(SupervisorServiceDeleteRequest) returns (SupervisorServiceDeleteResponse);
  rpc Get(SupervisorServiceGetRequest) returns (SupervisorServiceGetResponse);
  rpc List(SupervisorServiceListRequest) returns (SupervisorServiceListResponse);
}