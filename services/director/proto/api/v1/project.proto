syntax = "proto3";

package api.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

enum ProjectResourceTier {
  PROJECT_RESOURCE_TIER_UNSPECIFIED = 0;
  PROJECT_RESOURCE_TIER_MINIMUM = 1;
  PROJECT_RESOURCE_TIER_STANDARD = 2;
  PROJECT_RESOURCE_TIER_PERFORMANCE = 3;
}

message Project {
  string id = 1 [(buf.validate.field).string = {len: 24}];
  google.protobuf.BytesValue metadata = 2 [(buf.validate.field).bytes = {max_len: 2048}];
  google.protobuf.Timestamp create_time = 3 [(buf.validate.field).required = true];
  google.protobuf.Timestamp update_time = 4 [(buf.validate.field).required = true];
  api.v1.ProjectResourceTier resource_tier = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  google.protobuf.StringValue template_id = 6 [(buf.validate.field).string = {len: 24}];
  google.protobuf.StringValue supervisor_id = 7 [(buf.validate.field).string = {len: 24}];
  google.protobuf.StringValue workspace = 8 [(buf.validate.field).string = {max_len: 1024}];
}

message ProjectServiceCreateRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  google.protobuf.BytesValue metadata = 2 [(buf.validate.field).bytes = {max_len: 2048}];
  api.v1.ProjectResourceTier resource_tier = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  google.protobuf.StringValue template_id = 4 [(buf.validate.field).string = {len: 24}];
  google.protobuf.StringValue supervisor_id = 5 [(buf.validate.field).string = {len: 24}];
  google.protobuf.StringValue workspace = 6 [(buf.validate.field).string = {max_len: 1024}];
}

message ProjectServiceCreateResponse {
  api.v1.Project project = 1 [(buf.validate.field).required = true];
}

message ProjectServiceListRequest {
  int32 page = 1 [(buf.validate.field).int32 = {gt: 0}];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gt: 0
    lte: 100
  }];
}
message ProjectServiceListResponse {
  repeated api.v1.Project projects = 1 [(buf.validate.field).repeated = {min_items: 0}];
  int32 total = 2 [(buf.validate.field).int32 = {gte: 0}];
}

message ProjectServiceGetRequest {
  string id = 1 [(buf.validate.field).string = {len: 24}];
}
message ProjectServiceGetResponse {
  api.v1.Project project = 1 [(buf.validate.field).required = true];
}

message ProjectServiceUpdateMetadataRequest {
  string id = 1 [(buf.validate.field).string = {len: 24}];
  google.protobuf.BytesValue metadata = 2 [(buf.validate.field).bytes = {max_len: 2048}];
}
message ProjectServiceUpdateMetadataResponse {
  api.v1.Project project = 1 [(buf.validate.field).required = true];
}

message ProjectServiceDeleteRequest {
  string id = 1 [(buf.validate.field).string = {len: 24}];
}
message ProjectServiceDeleteResponse {}

message ProjectServiceLaunchRequest {
  string id = 1 [(buf.validate.field).string = {len: 24}];
}
message ProjectServiceLaunchResponse {}

service ProjectService {
  // Create a project; optionally initialize its file system from a template.
  rpc Create(ProjectServiceCreateRequest) returns (ProjectServiceCreateResponse);
  // List the current user's projects with pagination.
  rpc List(ProjectServiceListRequest) returns (ProjectServiceListResponse);
  // Get a project's details and its instance run status.
  rpc Get(ProjectServiceGetRequest) returns (ProjectServiceGetResponse);
  // Delete a project; cannot be deleted while its instance is running.
  rpc Delete(ProjectServiceDeleteRequest) returns (ProjectServiceDeleteResponse);
  // Update a project's metadata.
  rpc UpdateMetadata(ProjectServiceUpdateMetadataRequest) returns (ProjectServiceUpdateMetadataResponse);
}
