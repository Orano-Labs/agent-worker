syntax = "proto3";

package api.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

message TreeNodeFile {
  string mimetype = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {max_len: 255}
  ];
}

message TreeNodeDirectory {
  repeated TreeNode children = 1;
  bool loaded = 2;
}

message TreeNodeSymlink {
  string target = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      max_len: 4096
      min_len: 1
    }
  ];
}

message TreeNode {
  oneof type {
    option (buf.validate.oneof).required = true;

    TreeNodeFile file = 1;
    TreeNodeDirectory directory = 2;
    TreeNodeSymlink symlink = 3;
  }

  string name = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {max_len: 255}
  ];
  google.protobuf.Timestamp mtime = 6 [(buf.validate.field).required = true];
  google.protobuf.Timestamp ctime = 7 [(buf.validate.field).required = true];
  int64 size = 8 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64 = {gte: 0}
  ];
}

message FileSystemServiceTreeRequest {
  string project_id = 1 [(buf.validate.field).string = {len: 24}];
  google.protobuf.StringValue root = 2 [(buf.validate.field).string = {max_len: 4096}];
  int32 depth = 3 [(buf.validate.field).int32 = {gte: 0, lte: 10}];
}
message FileSystemServiceTreeResponse {
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {max_len: 255}
  ];
  google.protobuf.Timestamp mtime = 3 [(buf.validate.field).required = true];
  google.protobuf.Timestamp ctime = 4 [(buf.validate.field).required = true];
  int64 size = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64 = {gte: 0}
  ];
  repeated TreeNode children = 6;
}

message FileSystemServiceDownloadRequest {
  string project_id = 1 [(buf.validate.field).string = {len: 24}];
  string path = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      max_len: 4096
      min_len: 1
    }
  ];
}
message FileSystemServiceDownloadResponse {
  bytes chunk = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).bytes = {
      min_len: 1
      max_len: 65536 // 64KB
    }
  ];
}

message FileSystemServiceDeleteRequest {
  string project_id = 1 [(buf.validate.field).string = {len: 24}];
  string path = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      max_len: 4096
      min_len: 1
    }
  ];
}
message FileSystemServiceDeleteResponse {}

message FileSystemServiceMoveRequest {
  string project_id = 1 [(buf.validate.field).string = {len: 24}];
  string source = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      max_len: 4096
      min_len: 1
    }
  ];
  string target = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      max_len: 4096
      min_len: 1
    }
  ];
}
message FileSystemServiceMoveResponse {}

message FileSystemServiceCopyRequest {
  string project_id = 1 [(buf.validate.field).string = {len: 24}];
  string source = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      max_len: 4096
      min_len: 1
    }
  ];
  string target = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      max_len: 4096
      min_len: 1
    }
  ];
}
message FileSystemServiceCopyResponse {}

message FileSystemServiceCreateRequest {
  string project_id = 1 [(buf.validate.field).string = {len: 24}];
  string target = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      max_len: 4096
      min_len: 1
    }
  ];
  bool directory = 3;
}
message FileSystemServiceCreateResponse {}

service FileSystemService {
  rpc Tree(FileSystemServiceTreeRequest) returns (FileSystemServiceTreeResponse);
  rpc Download(FileSystemServiceDownloadRequest) returns (stream FileSystemServiceDownloadResponse);
  rpc Delete(FileSystemServiceDeleteRequest) returns (FileSystemServiceDeleteResponse);
  rpc Move(FileSystemServiceMoveRequest) returns (FileSystemServiceMoveResponse);
  rpc Copy(FileSystemServiceCopyRequest) returns (FileSystemServiceCopyResponse);
  rpc Create(FileSystemServiceCreateRequest) returns (FileSystemServiceCreateResponse);
}

message FileUploadServiceCreateRequest {
  string target = 1;
  string hash = 2;
  int64 size = 3;
}
message FileUploadServiceCreateResponse {
  string id = 1;
}

message FileUploadServiceUploadRequest {
  string id = 1;
  bytes chunk = 2;
  int32 chunk_index = 3;
}
message FileUploadServiceUploadResponse {}

message FileUploadServiceCompleteRequest {
  string id = 1;
}
message FileUploadServiceCompleteResponse {}

message FileUploadServiceCancelRequest {
  string id = 1;
}
message FileUploadServiceCancelResponse {}

message FileUploadServiceListRequest {}
message FileUploadServiceListResponse {}

message FileUploadServiceStatusRequest {}
message FileUploadServiceStatusResponse {}

service FileUploadService {
  rpc Create(FileUploadServiceCreateRequest) returns (FileUploadServiceCreateResponse);
  rpc Upload(FileUploadServiceUploadRequest) returns (FileUploadServiceUploadResponse);
  rpc Complete(FileUploadServiceCompleteRequest) returns (FileUploadServiceCompleteResponse);
  rpc Cancel(FileUploadServiceCancelRequest) returns (FileUploadServiceCancelResponse);
  rpc List(FileUploadServiceListRequest) returns (FileUploadServiceListResponse);
  rpc Status(FileUploadServiceStatusRequest) returns (FileUploadServiceStatusResponse);
}
