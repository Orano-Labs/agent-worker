<!doctype html>
<html lang="en">
  <head>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #1e1e1e;
      }

      #terminal {
        width: 100vw;
        height: 100vh;
      }

      .xterm {
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="terminal"/>

    <script>
      const term = new Terminal({
        cursorBlink: true,
        theme: {
          background: "#1e1e1e",
          foreground: "#d4d4d4",
        },
      });

      const fitAddon = new FitAddon.FitAddon();

      term.loadAddon(fitAddon);
      term.open(document.getElementById("terminal"));

      let ws = null;
      let reconnectAttempts = 0;
      let reconnectTimer = null;

      const maxReconnectDelay = 15000;

      const status = (text) => term.write(`\r\n\x1b[33m${text}\x1b[0m\r\n`);

      const wsUrl = () => {
        return `${window.location.protocol === "https:" ? "wss:" : "ws:"}//${window.location.host}/ws?cols=${term.cols}&rows=${term.rows}`;
      };

      const sendResize = () => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(
            JSON.stringify({
              type: "resize",
              cols: term.cols,
              rows: term.rows,
            }),
          );
        }
      };

      const scheduleReconnect = () => {
        if (reconnectTimer) {
          return;
        };

        const delay = Math.min(1000 * 2 ** reconnectAttempts, maxReconnectDelay);

        reconnectAttempts += 1;

        status(`Connection lost; retrying in ${Math.round(delay / 1000)}s...`);

        reconnectTimer = setTimeout(() => {
          reconnectTimer = null;
          connect();
        }, delay);
      };

      const connect = () => {
        if (reconnectTimer) {
          clearTimeout(reconnectTimer);
          reconnectTimer = null;
        }

        ws = new WebSocket(wsUrl());

        ws.onopen = () => {
          reconnectAttempts = 0;
          status("Connection established.");
          sendResize();
        };

        ws.onerror = () => {
          // onclose follows; handled there.
        };

        ws.onclose = (event) => {
          ws = null;
          status(`Connection closed (Code: ${event.code}); reconnecting...`);
          scheduleReconnect();
        };

        ws.onmessage = (message) => {
          term.write(message.data);
          fitAddon.fit();
        };
      };

      term.onData((data) => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "data", data }));
        }
      });

      window.addEventListener("resize", () => {
        fitAddon.fit();
        sendResize();
      });

      fitAddon.fit();
      connect();
    </script>
  </body>
</html>
