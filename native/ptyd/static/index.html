<!doctype html>
<html lang="en">
  <head>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #1e1e1e;
      }

      #terminal {
        width: 100vw;
        height: 100vh;
      }

      .xterm {
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="terminal"/>

    <script>
      const term = new Terminal({
        cursorBlink: true,
        theme: {
          background: "#1e1e1e",
          foreground: "#d4d4d4",
        },
      });

      const fitAddon = new FitAddon.FitAddon();

      term.loadAddon(fitAddon);
      term.open(document.getElementById("terminal"));

      term.onData((data) => {
        console.log(data);
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "data", data }));
        }
      });

      window.addEventListener("resize", () => {
        fitAddon.fit();

        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(
            JSON.stringify({
              type: "resize",
              cols: term.cols,
              rows: term.rows,
            }),
          );
        }
      });

      fitAddon.fit();

      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const url = `${protocol}//${window.location.host}/ws?cols=${term.cols}&rows=${term.rows}`;
      const ws = new WebSocket(url);

      ws.onopen = () => {
        ws.send(
          JSON.stringify({
            type: "resize",
            cols: term.cols,
            rows: term.rows,
          }),
        );
      };

      ws.onerror = () => {
        term.write("\r\n\x1b[31mError: Connection error occurred.\x1b[0m\r\n");
      };

      ws.onclose = (event) => {
        term.write(
          `\r\n\x1b[33mConnection closed (Code: ${event.code}).\x1b[0m\r\n`,
        );
      };

      ws.onmessage = (message) => {
        term.write(message.data);

        fitAddon.fit();
      };
    </script>
  </body>
</html>
