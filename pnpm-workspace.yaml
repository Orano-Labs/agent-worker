packages:
  - packages/*
  - services/*
  - native/*

allowBuilds:
  '@bufbuild/buf': true
  '@google/genai': true
  '@prisma/engines': true
  better-sqlite3: true
  cpu-features: true
  esbuild: true
  lefthook: true
  lmdb: true
  msgpackr-extract: true
  msw: true
  prisma: true
  protobufjs: true
  sharp: true
  ssh2: true

onlyBuiltDependencies:
  - '@bufbuild/buf'
  - '@google/genai'
  - '@prisma/engines'
  - better-sqlite3
  - cpu-features
  - esbuild
  - lefthook
  - lmdb
  - msgpackr-extract
  - msw
  - node-pty
  - prisma
  - protobufjs
  - sharp
  - ssh2

patchedDependencies:
  '@bufbuild/protovalidate': patches/@bufbuild__protovalidate.patch
