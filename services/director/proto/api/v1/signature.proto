syntax = "proto3";

package api.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// User identity
// Represents an end user making a request
message SignatureUserIdentity {
  // Unique user ID, fixed 24 characters (MongoDB ObjectId format)
  string id = 1 [(buf.validate.field).string = {len: 24}];
}

// Manager identity
// No extra ID needed; being present indicates manager identity
message SignatureManagerIdentity {}

// Worker identity
// Represents a Supervisor node that executes tasks
message SignatureSupervisorIdentity {
  // Unique Worker ID, fixed 24 characters
  string id = 1 [(buf.validate.field).string = {len: 24}];
}

message SignatureIdentity {
  oneof identity {
    option (buf.validate.oneof).required = true;

    api.v1.SignatureUserIdentity user = 1;
    api.v1.SignatureManagerIdentity manager = 2;
    api.v1.SignatureSupervisorIdentity supervisor = 3;
  }
}

message SignaturePayload {
  bytes nonce = 1 [(buf.validate.field).bytes = {len: 32}];
  google.protobuf.Timestamp timestamp = 2 [(buf.validate.field).required = true];
  api.v1.SignatureIdentity identity = 3 [(buf.validate.field).required = true];
}

// Complete request signature
// Composed of the payload (SignaturePayload) and an ed25519 digital signature over it
// Base64-encoded after serialization and embedded in the x-request-signature header
message Signature {
  // Signature payload containing nonce, timestamp, and identity
  api.v1.SignaturePayload payload = 1 [(buf.validate.field).required = true];
  // ed25519 digital signature, fixed 64 bytes
  // Signed message construction:
  //   User / Worker: Hex(nonce) + ":" + UnixTimestamp(Second) + ":" + id
  //   Manager:      Hex(nonce) + ":" + UnixTimestamp(Second)
  bytes signature = 2 [(buf.validate.field).bytes = {len: 64}];
}
