syntax = "proto3";

package api.v1;

import "api/v1/project.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

enum AcknowledgeStatus {
  ACKNOWLEDGE_STATUS_UNSPECIFIED = 0;
  ACKNOWLEDGE_STATUS_OK = 1;
  ACKNOWLEDGE_STATUS_REJECT = 2;
}

message Load {
  string instance_id = 1 [(buf.validate.field).string = {len: 24}];
  string project_id = 2 [(buf.validate.field).string = {len: 24}];
  api.v1.ProjectResourceTier project_resource_tier = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  bool confirmed = 4;
  google.protobuf.Timestamp timestamp = 5 [(buf.validate.field).required = true];
}

message SupervisorPortalServiceWatchRequest {}
message SupervisorPortalServiceWatchResponse {
  oneof event {
    api.v1.EventKeepalive keepalive = 4;
    EventLoadList load = 5;
  }
}

message SupervisorPortalServiceReleaseRequest {
  string instance_id = 1 [(buf.validate.field).string = {len: 24}];
}
message SupervisorPortalServiceReleaseResponse {}

message SupervisorPortalServiceAcknowledgeRequest {
  string instance_id = 1 [(buf.validate.field).string = {len: 24}];
  api.v1.AcknowledgeStatus status = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}
message SupervisorPortalServiceAcknowledgeResponse {}

message EventLoadList {
  repeated Load list = 1;
}

message EventKeepalive {}

message SupervisorPortalServiceHeartbeatRequest {}
message SupervisorPortalServiceHeartbeatResponse {}

service SupervisorPortalService {
  rpc Watch(SupervisorPortalServiceWatchRequest) returns (stream SupervisorPortalServiceWatchResponse);
  rpc Release(SupervisorPortalServiceReleaseRequest) returns (SupervisorPortalServiceReleaseResponse);
  rpc Acknowledge(SupervisorPortalServiceAcknowledgeRequest) returns (SupervisorPortalServiceAcknowledgeResponse);
  rpc Heartbeat(SupervisorPortalServiceHeartbeatRequest) returns (SupervisorPortalServiceHeartbeatResponse);
}
