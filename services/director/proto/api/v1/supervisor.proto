syntax = "proto3";

package api.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

message Supervisor {
  string id = 1 [(buf.validate.field).string = {len: 24}];
  bytes public_key = 2 [(buf.validate.field).bytes = {
    min_len: 16
    max_len: 128
  }];
  google.protobuf.BytesValue metadata = 3 [(buf.validate.field).bytes = {max_len: 2048}];
  google.protobuf.Timestamp create_time = 4 [(buf.validate.field).required = true];
  google.protobuf.Timestamp update_time = 5 [(buf.validate.field).required = true];
  bool online = 6;
}

message SupervisorServiceCreateRequest {
  google.protobuf.BytesValue metadata = 1 [(buf.validate.field).bytes = {max_len: 2048}];
}
message SupervisorServiceCreateResponse {
  api.v1.Supervisor supervisor = 1 [(buf.validate.field).required = true];
  bytes private_key = 2 [(buf.validate.field).bytes = {
    min_len: 16
    max_len: 128
  }];
}

message SupervisorServiceUpdateMetadataRequest {
  string id = 1 [(buf.validate.field).string = {len: 24}];
  google.protobuf.BytesValue metadata = 2 [(buf.validate.field).bytes = {max_len: 2048}];
}
message SupervisorServiceUpdateMetadataResponse {
  api.v1.Supervisor supervisor = 1 [(buf.validate.field).required = true];
}

message SupervisorServiceDeleteRequest {
  string id = 1 [(buf.validate.field).string = {len: 24}];
}
message SupervisorServiceDeleteResponse {}

message SupervisorServiceGetRequest {
  string id = 1 [(buf.validate.field).string = {len: 24}];
}
message SupervisorServiceGetResponse {
  api.v1.Supervisor supervisor = 1 [(buf.validate.field).required = true];
}

message SupervisorServiceListRequest {
  int32 page = 1 [(buf.validate.field).int32 = {gt: 0}];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gt: 0
    lte: 100
  }];
  google.protobuf.BoolValue disabled = 3;
}
message SupervisorServiceListResponse {
  repeated api.v1.Supervisor supervisors = 1 [(buf.validate.field).repeated = {min_items: 0}];
  int32 total = 2 [(buf.validate.field).int32 = {gte: 0}];
}

service SupervisorService {
  // Register a Supervisor, generating and returning its key pair.
  rpc Create(SupervisorServiceCreateRequest) returns (SupervisorServiceCreateResponse);
  // Update a Supervisor's metadata.
  rpc UpdateMetadata(SupervisorServiceUpdateMetadataRequest) returns (SupervisorServiceUpdateMetadataResponse);
  // Delete a Supervisor; cannot be deleted while online.
  rpc Delete(SupervisorServiceDeleteRequest) returns (SupervisorServiceDeleteResponse);
  // Get a Supervisor's details.
  rpc Get(SupervisorServiceGetRequest) returns (SupervisorServiceGetResponse);
  // List Supervisors with pagination.
  rpc List(SupervisorServiceListRequest) returns (SupervisorServiceListResponse);
}
