syntax = "proto3";

package api.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "api/v1/project.proto";

message Task {
  string project_id = 1;
  string token = 2;
  api.v1.ProjectResourceTier project_resource_tier = 3;
}

message SupervisorPortalServiceFetchRequest {
  api.v1.ProjectResourceTier resource_tier = 3;
}
message SupervisorPortalServiceFetchResponse {
  api.v1.Task task = 1;
}

message SupervisorPortalServiceReportRequest {
  int32 running_projects = 1;
  double cpu_usage = 2;
  double memory_usage = 3;
  double disk_usage = 4;
}
message SupervisorPortalServiceReportResponse {}

message SupervisorPortalServiceExtendLeaseRequest {
  string project_id = 1;
  string token = 2 [(buf.validate.field).string = {min_len: 1}];
}
message SupervisorPortalServiceExtendLeaseResponse {}

message SupervisorPortalServiceCompleteSuccessRequest {
  string project_id = 1;
  string token = 2 [(buf.validate.field).string = {min_len: 1}];
}
message SupervisorPortalServiceCompleteSuccessResponse {}

message SupervisorPortalServiceCompleteFailureRequest {
  string project_id = 1;
  string token = 2 [(buf.validate.field).string = {min_len: 1}];
  string error = 3;
}
message SupervisorPortalServiceCompleteFailureResponse {}

service SupervisorPortalService {
  // Fetch a task the current Supervisor can execute; returns an empty response if none match.
  rpc Fetch(SupervisorPortalServiceFetchRequest) returns (SupervisorPortalServiceFetchResponse);
  // Continuously report resource metrics (client-streaming); marks the Supervisor offline when the stream ends.
  rpc Report(stream SupervisorPortalServiceReportRequest) returns (SupervisorPortalServiceReportResponse);
  // Extends the lease/heartbeat for a currently running task.
  rpc ExtendLease(SupervisorPortalServiceExtendLeaseRequest) returns (SupervisorPortalServiceExtendLeaseResponse);
  // Report that a task was executed successfully.
  rpc CompleteSuccess(SupervisorPortalServiceCompleteSuccessRequest) returns (SupervisorPortalServiceCompleteSuccessResponse);
  // Report that a task execution failed or encountered an error.
  rpc CompleteFailure(SupervisorPortalServiceCompleteFailureRequest) returns (SupervisorPortalServiceCompleteFailureResponse);
}
